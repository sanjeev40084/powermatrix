name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:        # <--- New Trigger: Runs on PRs targeting main
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # JOB 1: QUALITY CHECKS (Runs on PRs AND Pushes)
  # ------------------------------------------------------------------
  quality-check:
    name: 🧪 Run Automated Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Local Server & Run Tests
        run: |
          npx http-server -p 8080 & 
          sleep 3
          npx playwright test --reporter=html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

  # ------------------------------------------------------------------
  # JOB 2: DEPLOY (Runs ONLY on Push to Main, skipped on PRs)
  # ------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: quality-check
    # This condition ensures we don't deploy PR builds to the live site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Injects Commit Hash & Time into HTML Footer
      - name: Inject Build Version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
          sed -i "s/__BUILD_VERSION__/$SHORT_SHA  •  $BUILD_DATE/g" index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4