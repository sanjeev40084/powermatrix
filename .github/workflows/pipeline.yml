name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run this manually if needed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # JOB 1: QUALITY CHECKS (Must pass for deployment to start)
  # ------------------------------------------------------------------
  quality-check:
    name: 🧪 Run Automated Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Local Server & Run Tests
        run: |
          npx http-server -p 8080 & 
          sleep 3
          npx playwright test --reporter=html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

  # ------------------------------------------------------------------
  # JOB 2: DEPLOY TO GITHUB PAGES (Runs only if 'quality-check' passes)
  # ------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: quality-check # <--- THIS IS THE KEY! Gates deployment behind tests.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4