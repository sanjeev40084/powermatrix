<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Platform Deployment Settings Generator</title>
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            /* Light Theme Defaults */
            --primary: #0078d4;
            --bg: #f3f2f1;
            --surface: #ffffff;
            --border: #e1dfdd;
            --text: #323130;
            --sub-text: #605e5c;
            --input-bg: #ffffff;
            --input-border: #8a8886;
            --header-bg: #faf9f8;
            --pill-bg: #eff6fc;
            --pill-border: #c7e0f4;
            --pill-text: #0078d4;
            --code-bg: #252526;
            --code-text: #d4d4d4;
            --shadow: 0 1.6px 3.6px 0 rgba(0,0,0,0.132), 0 0.3px 0.9px 0 rgba(0,0,0,0.108);
        }

        [data-theme="dark"] {
            /* Dark Theme Overrides */
            --primary: #4fafff; /* Brighter blue for dark mode contrast */
            --bg: #121212;
            --surface: #1e1e1e;
            --border: #333333;
            --text: #f5f5f5;
            --sub-text: #a19f9d;
            --input-bg: #2d2d2d;
            --input-border: #555555;
            --header-bg: #252525;
            --pill-bg: #1b2b3a;
            --pill-border: #224663;
            --pill-text: #6cb8f7;
            --shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header Area */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--text); }
        h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: var(--text); }

        /* --- COMPONENTS --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            padding: 25px;
            border-radius: 4px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"], select {
            padding: 8px 12px;
            background-color: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 2px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus, select:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        /* Connection Inputs Group */
        .conn-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        /* Connector ID Field styling */
        .conn-input-group input:nth-child(2) {
            font-size: 0.75rem;
            font-family: monospace;
        }

        /* Buttons */
        button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }
        [data-theme="dark"] button { color: #121212; /* Dark text on bright button in dark mode */ }
        [data-theme="dark"] button.secondary { color: #f5f5f5; }
        [data-theme="dark"] button.delete { color: #ff6b6b; }
        [data-theme="dark"] button.success { color: white; }

        button:hover { opacity: 0.9; }
        button.secondary { background-color: var(--bg); color: var(--text); border: 1px solid var(--input-border); }
        button.delete { background-color: transparent; color: #a4262c; padding: 4px; font-size: 1.2rem; border: none; min-width: auto; }
        button.success { background-color: #107c10; }

        /* Icon Button Style */
        .icon-btn {
            background-color: var(--bg); 
            color: var(--text); 
            border: 1px solid var(--input-border);
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border-radius: 2px;
        }
        .icon-btn:hover {
            background-color: var(--pill-bg);
            color: var(--primary);
            border-color: var(--pill-border);
        }
        
        /* Toggle Switch for Dark Mode */
        .theme-toggle {
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .theme-toggle:hover { background-color: var(--bg); }

        /* Tabs */
        .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab { 
            padding: 10px 5px; 
            cursor: pointer; 
            border-bottom: 3px solid transparent; 
            font-weight: 600;
            font-size: 1rem;
            color: var(--sub-text);
        }
        .tab:hover { color: var(--text); }
        .tab.active { border-bottom-color: var(--primary); color: var(--text); }

        /* Tables */
        .table-wrapper { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { background-color: var(--header-bg); font-weight: 600; font-size: 0.85rem; color: var(--text); }
        
        .sub-label {
            display: block;
            font-size: 0.7rem;
            color: var(--sub-text);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Output Section */
        .preview-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 20px;
            border-radius: 4px;
            overflow: auto;
            max-height: 400px;
            margin: 0;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            width: 100%; /* Full Width */
            box-sizing: border-box;
        }

        .stage-pill {
            background: var(--pill-bg);
            color: var(--pill-text);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--pill-border);
        }
        .stage-pill span { cursor: pointer; margin-left: 8px; font-weight: bold; }
        .stage-pill span:hover { opacity: 0.7; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>Power Platform Deployment Settings</h1>
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
            </button>
        </div>

        <div class="card">
            <h2>Configuration Matrix</h2>
            
            <div class="controls">
                <span style="font-weight:600;">Deployment Stages:</span>
                <div id="stageList" style="display:flex; gap:10px; flex-wrap: wrap;"></div>
                <div style="display:flex; gap: 5px;">
                    <input type="text" id="newStageInput" placeholder="New Stage Name" style="width: 150px;">
                    <button class="secondary" onclick="addStage()">Add</button>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('env')" id="tab-env">Environment Variables</div>
                <div class="tab" onclick="switchTab('conn')" id="tab-conn">Connection References</div>
            </div>

            <div id="section-env">
                <div class="table-wrapper">
                    <table id="envTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="secondary" onclick="addRow('env')">+ Add Variable</button>
            </div>

            <div id="section-conn" style="display:none;">
                <div class="table-wrapper">
                    <table id="connTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="secondary" onclick="addRow('conn')">+ Add Connection Reference</button>
            </div>
        </div>

        <div class="card">
            <h2>Generate Output</h2>
            
            <div class="preview-header">
                <span style="font-weight:600;">JSON Preview</span>
                <div class="header-controls">
                    <select id="stageSelect" onchange="generateJSON()" style="width: 150px;">
                    </select>
                    <button class="icon-btn" onclick="copyToClipboard()" title="Copy JSON to Clipboard">📋</button>
                </div>
            </div>
            
            <pre id="jsonOutput">{}</pre>
        </div>
    </div>

    <script>
        // --- THEME MANAGEMENT ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            
            if (theme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = 'Light Mode';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'Dark Mode';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        // --- STATE MANAGEMENT ---
        const state = {
            stages: ['QA', 'TST', 'PRD'],
            envVars: [
                { id: 1, key: 'cr56_sample_var', values: { 'QA': 'val_qa', 'TST': 'val_tst', 'PRD': 'val_prd' } }
            ],
            connRefs: [
                { 
                    id: 1, 
                    key: 'cr56_shared_sharepoint', 
                    values: { 
                        'QA': { connectionId: '', connectorId: '' },
                        'TST': { connectionId: '', connectorId: '' },
                        'PRD': { connectionId: '', connectorId: '' }
                    } 
                }
            ]
        };

        // --- RENDER FUNCTIONS ---
        function init() {
            initTheme(); // Initialize Dark Mode
            renderStages();
            renderTable('env');
            renderTable('conn');
            updateStageSelect();
            generateJSON();
        }

        function renderStages() {
            const container = document.getElementById('stageList');
            container.innerHTML = state.stages.map(s => 
                `<span class="stage-pill">${s} <span onclick="removeStage('${s}')">&times;</span></span>`
            ).join('');
        }

        function renderTable(type) {
            const tableId = type === 'env' ? 'envTable' : 'connTable';
            const data = type === 'env' ? state.envVars : state.connRefs;
            const keyLabel = type === 'env' ? 'Schema Name' : 'Logical Name';

            const thead = document.querySelector(`#${tableId} thead`);
            const tbody = document.querySelector(`#${tableId} tbody`);

            // 1. Build Header
            let headerHTML = `<tr><th style="width:300px">${keyLabel}</th>`;
            state.stages.forEach(stage => {
                headerHTML += `<th>${stage}</th>`;
            });
            headerHTML += `<th style="width:40px"></th></tr>`;
            thead.innerHTML = headerHTML;

            // 2. Build Body
            tbody.innerHTML = data.map(row => {
                let rowHTML = `<tr>`;
                
                // Column 1: Key
                rowHTML += `<td>                    
                    <input type="text" value="${row.key}" oninput="updateKey('${type}', ${row.id}, this.value)">
                </td>`;
                
                // Column 2...N: Stage Values
                state.stages.forEach(stage => {
                    if (type === 'env') {
                        // Environment Variable - Default to empty string
                        const val = row.values[stage] || '';
                        rowHTML += `<td>
                            <input type="text" placeholder="Value" value="${val}" oninput="updateEnvValue(${row.id}, '${stage}', this.value)">
                        </td>`;
                    } else {
                        // Connection Reference - Default to empty object
                        const val = row.values[stage] || {};
                        const connId = val.connectionId || '';
                        const connectorId = val.connectorId || '';
                        
                        rowHTML += `<td>
                            <div class="conn-input-group">
                                <input type="text" placeholder="Connection ID (GUID)" value="${connId}" oninput="updateConnValue(${row.id}, '${stage}', 'connectionId', this.value)">
                                <input type="text" placeholder="/providers/Microsoft.PowerApps/apis/shared_..." value="${connectorId}" oninput="updateConnValue(${row.id}, '${stage}', 'connectorId', this.value)">
                            </div>
                        </td>`;
                    }
                });

                // Delete Button
                rowHTML += `<td><button class="delete" onclick="deleteRow('${type}', ${row.id})">&times;</button></td></tr>`;
                return rowHTML;
            }).join('');
        }

        function updateStageSelect() {
            const select = document.getElementById('stageSelect');
            const currentVal = select.value;
            
            // Build options for stages
            let options = state.stages.map(s => `<option value="${s}">${s}</option>`).join('');
            
            // Add 'ALL' option if stages exist
            if(state.stages.length > 0) {
                options += `<option value="ALL">ALL (Combined)</option>`;
            }
            
            select.innerHTML = options;

            // Logic to preserve selection or default
            if(state.stages.includes(currentVal) || currentVal === 'ALL') {
                select.value = currentVal;
            } else if(state.stages.length > 0) {
                select.value = state.stages[0];
            }
        }

        // --- ACTIONS ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            document.getElementById('section-env').style.display = tab === 'env' ? 'block' : 'none';
            document.getElementById('section-conn').style.display = tab === 'conn' ? 'block' : 'none';
        }

        function addStage() {
            const input = document.getElementById('newStageInput');
            const val = input.value.trim();
            if(val && !state.stages.includes(val)) {
                state.stages.push(val);
                input.value = '';
                refreshAll();
            }
        }

        function removeStage(stageName) {
            if(confirm(`Remove stage "${stageName}"?`)) {
                state.stages = state.stages.filter(s => s !== stageName);
                refreshAll();
            }
        }

        function addRow(type) {
            const newRow = { id: Date.now(), key: '', values: {} };
            if(type === 'env') state.envVars.push(newRow);
            else state.connRefs.push(newRow);
            renderTable(type);
        }

        function deleteRow(type, id) {
            if(type === 'env') state.envVars = state.envVars.filter(r => r.id !== id);
            else state.connRefs = state.connRefs.filter(r => r.id !== id);
            renderTable(type);
            generateJSON();
        }

        function updateKey(type, id, val) {
            const data = type === 'env' ? state.envVars : state.connRefs;
            const item = data.find(r => r.id === id);
            if(item) { item.key = val; generateJSON(); }
        }

        function updateEnvValue(id, stage, val) {
            const item = state.envVars.find(r => r.id === id);
            if(item) { item.values[stage] = val; generateJSON(); }
        }

        function updateConnValue(id, stage, field, val) {
            const item = state.connRefs.find(r => r.id === id);
            if(item) { 
                if(!item.values[stage]) item.values[stage] = { connectionId: '', connectorId: '' };
                item.values[stage][field] = val;
                generateJSON(); 
            }
        }

        function refreshAll() {
            renderStages();
            renderTable('env');
            renderTable('conn');
            updateStageSelect();
            generateJSON();
        }

        // --- GENERATOR LOGIC ---
        function buildPayload(stage) {
            const output = {
                "EnvironmentVariables": [],
                "ConnectionReferences": []
            };

            state.envVars.forEach(v => {
                if(v.key) {
                    output.EnvironmentVariables.push({
                        "SchemaName": v.key,
                        "Value": v.values[stage] || ""
                    });
                }
            });

            state.connRefs.forEach(c => {
                if(c.key) {
                    const valObj = c.values[stage] || {};
                    output.ConnectionReferences.push({
                        "LogicalName": c.key,
                        "ConnectionId": valObj.connectionId || "",
                        "ConnectorId": valObj.connectorId || ""
                    });
                }
            });
            return output;
        }

        function buildAllPayload() {
            const allData = {};
            state.stages.forEach(stage => {
                allData[stage] = buildPayload(stage);
            });
            return allData;
        }

        function generateJSON() {
            const stage = document.getElementById('stageSelect').value;
            if(!stage) {
                document.getElementById('jsonOutput').textContent = "{}";
                return;
            }

            let output;
            if (stage === 'ALL') {
                output = buildAllPayload();
            } else {
                output = buildPayload(stage);
            }
            
            document.getElementById('jsonOutput').textContent = JSON.stringify(output, null, 2);
        }

        function copyToClipboard() {
            const text = document.getElementById('jsonOutput').textContent;
            navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
        }

        // Start
        init();
    </script>
</body>
</html>
