<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Platform Deployment Settings</title>
    <style>
        /* --- FLUENT THEME VARIABLES --- */
        :root {
            /* Light Theme */
            --primary: #0078d4;
            --primary-hover: #106ebe;
            --bg: #f3f2f1;
            --surface: #ffffff;
            --text: #201f1e;
            --sub-text: #605e5c;
            --border: #edebe9;
            --error: #a80000;
            
            --input-bg: #ffffff;
            --input-border: #8a8886;
            --input-border-hover: #323130;
            --input-placeholder: #605e5c;

            --header-bg: #faf9f8;
            --pill-bg: #eff6fc;
            --pill-text: #0078d4;
            
            --code-bg: #f3f2f1;
            --code-text: #201f1e;

            --shadow: 0 1.6px 3.6px 0 rgba(0,0,0,0.132), 0 0.3px 0.9px 0 rgba(0,0,0,0.108);
            --focus-border: 2px solid #0078d4;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --primary: #2899f5;
            --primary-hover: #72b9f8;
            --bg: #201f1e;
            --surface: #323130;
            --text: #ffffff;
            --sub-text: #c8c6c4;
            --border: #484644;
            --error: #f1707b;

            --input-bg: #323130;
            --input-border: #8a8886;
            --input-border-hover: #f3f2f1;
            --input-placeholder: #a19f9d;

            --header-bg: #252423;
            --pill-bg: #3b3a39;
            --pill-text: #72b9f8;

            --code-bg: #1b1a19;
            --code-text: #d4d4d4;

            --shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 20px;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Header Area */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap; /* Allow wrapping */
            gap: 16px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        h1 { font-size: 20px; font-weight: 600; margin: 0; color: var(--text); }
        h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px 0; color: var(--text); }

        /* --- COMPONENTS --- */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--surface);
            padding: 20px 24px;
            border-radius: 2px;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
        }

        /* Controls Area */
        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between; /* Space out items */
            flex-wrap: wrap;
        }
        
        .stage-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .add-stage-wrapper {
            display: flex;
            gap: 8px;
        }

        /* Input Styles */
        input[type="text"], select {
            height: 32px;
            padding: 0 8px;
            background-color: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 2px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            width: 100%;
            transition: all 0.1s;
        }

        input[type="text"]::placeholder { color: var(--input-placeholder); }
        input[type="text"]:hover, select:hover { border-color: var(--input-border-hover); }
        input[type="text"]:focus, select:focus {
            outline: none;
            border: var(--focus-border);
            padding: 0 7px;
        }

        /* Responsive Input for New Stage */
        #newStageInput {
            width: 150px; /* Default width */
        }

        /* Connection Inputs Group */
        .conn-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .conn-input-group input:nth-child(2) {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            color: var(--sub-text);
        }

        /* Buttons */
        button {
            height: 32px;
            padding: 0 16px;
            background-color: var(--primary);
            color: #ffffff;
            border: 1px solid transparent;
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        [data-theme="dark"] button { color: #121212; }
        [data-theme="dark"] button.secondary { color: var(--text); }
        [data-theme="dark"] button.delete { color: #ff6b6b; }
        [data-theme="dark"] button.icon-btn,
        [data-theme="dark"] button.theme-toggle,
        [data-theme="dark"] button.reset-btn { color: var(--text); }

        button:hover { background-color: var(--primary-hover); }
        
        button.secondary { 
            background-color: var(--surface); 
            color: var(--text); 
            border: 1px solid var(--input-border); 
        }
        button.secondary:hover { background-color: var(--bg); border-color: var(--input-border-hover); }

        button.delete { 
            background-color: transparent; 
            color: #a4262c; 
            padding: 4px; 
            width: 32px; 
            font-size: 18px; 
            min-width: auto; 
        }
        button.delete:hover { background-color: rgba(164, 38, 44, 0.1); }

        button.icon-btn {
            background-color: transparent;
            color: var(--text);
            border: 1px solid transparent;
            width: 32px;
            padding: 0;
            font-size: 16px;
        }
        button.icon-btn:hover {
            background-color: var(--bg);
            border-color: var(--input-border);
            color: var(--primary);
        }

        button.theme-toggle, button.reset-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text);
            font-weight: 400;
        }
        button.theme-toggle:hover, button.reset-btn:hover {
            background-color: var(--surface);
            color: var(--primary);
        }

        /* Tabs */
        .tabs { 
            display: flex; 
            gap: 24px; 
            margin-bottom: 20px; 
            border-bottom: 1px solid var(--border); 
            overflow-x: auto; /* Allow horizontal scroll for tabs */
            white-space: nowrap;
        }
        .tab { 
            padding: 0 4px 10px 4px; 
            cursor: pointer; 
            border-bottom: 2px solid transparent; 
            font-weight: 400;
            font-size: 14px;
            color: var(--sub-text);
            transition: all 0.2s;
            margin-bottom: -1px;
        }
        .tab:hover { color: var(--text); }
        .tab.active { 
            border-bottom-color: var(--primary); 
            color: var(--text); 
            font-weight: 600;
        }

        /* Tables */
        .table-wrapper { 
            overflow-x: auto; 
            margin-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--input-border) transparent;
            -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
        }
        
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        
        th, td { 
            text-align: left; 
            padding: 12px 8px; 
            border-bottom: 1px solid var(--border); 
            vertical-align: top; 
        }
        
        th { 
            font-weight: 600; 
            font-size: 12px; 
            color: var(--text); 
            background-color: transparent;
        }
        
        /* Preview & Toast */
        .preview-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap; /* Wrap on small screens */
            gap: 10px;
        }
        
        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 16px;
            border-radius: 2px;
            overflow: auto;
            max-height: 400px;
            margin: 0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            border: 1px solid var(--border);
            width: 100%;
            box-sizing: border-box;
        }

        .stage-pill {
            background: var(--pill-bg);
            color: var(--pill-text);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            height: 24px;
        }
        .stage-pill span { cursor: pointer; margin-left: 8px; font-size: 14px; display: flex; align-items: center;}
        .stage-pill span:hover { opacity: 0.7; }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #323130;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
        [data-theme="dark"] #toast {
            background-color: #f3f2f1;
            color: #201f1e;
        }

        /* --- RESPONSIVE STYLES --- */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            
            .header-row {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header-actions {
                width: 100%;
                justify-content: space-between;
                margin-top: 8px;
            }
            
            .controls {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .add-stage-wrapper {
                width: 100%;
            }
            
            #newStageInput {
                flex: 1; /* Allow input to grow */
                width: auto;
            }
            
            .card {
                padding: 16px;
            }
            
            .preview-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header-controls {
                width: 100%;
                margin-top: 8px;
            }
            
            #stageSelect {
                flex: 1;
                width: auto;
            }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>Power Platform Deployment Settings</h1>
            <div class="header-actions">
                <button class="reset-btn" onclick="resetData()" title="Clear all data and start over">
                    🗑️ Reset
                </button>
                <button class="theme-toggle" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
                </button>
            </div>
        </div>

        <div class="card">
            <h2>Configuration Matrix</h2>
            
            <div class="controls">
                <div class="stage-group">
                    <span style="font-size: 14px; font-weight: 600; color: var(--text);">Stages:</span>
                    <div id="stageList" style="display:flex; gap:8px; flex-wrap: wrap;"></div>
                </div>
                
                <div class="add-stage-wrapper">
                    <input type="text" id="newStageInput" placeholder="New Stage Name">
                    <button class="secondary" onclick="addStage()">Add</button>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('env')" id="tab-env">Environment Variables</div>
                <div class="tab" onclick="switchTab('conn')" id="tab-conn">Connection References</div>
            </div>

            <div id="section-env">
                <div class="table-wrapper">
                    <table id="envTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="secondary" onclick="addRow('env')">
                    <span style="margin-right: 6px; font-size: 16px;">+</span> Add Variable
                </button>
            </div>

            <div id="section-conn" style="display:none;">
                <div class="table-wrapper">
                    <table id="connTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="secondary" onclick="addRow('conn')">
                    <span style="margin-right: 6px; font-size: 16px;">+</span> Add Reference
                </button>
            </div>
        </div>

        <div class="card">
            <div class="preview-header">
                <span style="font-weight:600; font-size: 16px;">JSON Output</span>
                <div class="header-controls">
                    <select id="stageSelect" onchange="generateJSON()">
                    </select>
                    <button class="icon-btn" onclick="copyToClipboard()" title="Copy to Clipboard">📋</button>
                </div>
            </div>
            
            <pre id="jsonOutput">{}</pre>
        </div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script>
        // --- THEME & STORAGE MANAGEMENT ---
        const STORAGE_KEY = 'pp_deployment_settings_data';
        const THEME_KEY = 'theme';

        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            
            if (theme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = 'Light Mode';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'Dark Mode';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        // --- STATE MANAGEMENT ---
        const defaultState = {
            stages: ['QA', 'TST', 'PRD'],
            envVars: [
                { id: 1, key: 'cr56_sample_var', values: { 'QA': 'val_qa', 'TST': 'val_tst', 'PRD': 'val_prd' } }
            ],
            connRefs: [
                { 
                    id: 1, 
                    key: 'cr56_shared_sharepoint', 
                    values: { 
                        'QA': { connectionId: '', connectorId: '' },
                        'TST': { connectionId: '', connectorId: '' },
                        'PRD': { connectionId: '', connectorId: '' }
                    } 
                }
            ]
        };

        let state = JSON.parse(JSON.stringify(defaultState));

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) {
                    console.error("Failed to load saved state", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function resetData() {
            if(confirm("Are you sure you want to reset all data? This cannot be undone.")) {
                state = JSON.parse(JSON.stringify(defaultState));
                saveState();
                refreshAll();
                showToast("Data reset successfully");
            }
        }

        // --- RENDER FUNCTIONS ---
        function init() {
            initTheme();
            loadState(); // Load data from localStorage
            refreshAll();
        }

        function renderStages() {
            const container = document.getElementById('stageList');
            container.innerHTML = state.stages.map(s => 
                `<span class="stage-pill">${s} <span onclick="removeStage('${s}')">&times;</span></span>`
            ).join('');
        }

        function renderTable(type) {
            const tableId = type === 'env' ? 'envTable' : 'connTable';
            const data = type === 'env' ? state.envVars : state.connRefs;
            const keyLabel = type === 'env' ? 'Schema Name' : 'Logical Name';

            const thead = document.querySelector(`#${tableId} thead`);
            const tbody = document.querySelector(`#${tableId} tbody`);

            // 1. Build Header
            let headerHTML = `<tr><th style="width:250px">${keyLabel}</th>`;
            state.stages.forEach(stage => {
                headerHTML += `<th>${stage}</th>`;
            });
            headerHTML += `<th style="width:40px"></th></tr>`;
            thead.innerHTML = headerHTML;

            // 2. Build Body
            tbody.innerHTML = data.map(row => {
                let rowHTML = `<tr>`;
                
                // Column 1: Key
                rowHTML += `<td>                    
                    <input type="text" value="${row.key}" oninput="updateKey('${type}', ${row.id}, this.value)">
                </td>`;
                
                // Column 2...N: Stage Values
                state.stages.forEach(stage => {
                    if (type === 'env') {
                        // Environment Variable
                        const val = row.values[stage] || '';
                        rowHTML += `<td>
                            <input type="text" placeholder="Value" value="${val}" oninput="updateEnvValue(${row.id}, '${stage}', this.value)">
                        </td>`;
                    } else {
                        // Connection Reference
                        const val = row.values[stage] || {};
                        const connId = val.connectionId || '';
                        const connectorId = val.connectorId || '';
                        
                        rowHTML += `<td>
                            <div class="conn-input-group">
                                <input type="text" placeholder="Connection ID (GUID)" value="${connId}" oninput="updateConnValue(${row.id}, '${stage}', 'connectionId', this.value)">
                                <input type="text" placeholder="/providers/Microsoft.PowerApps/apis/shared_..." value="${connectorId}" oninput="updateConnValue(${row.id}, '${stage}', 'connectorId', this.value)">
                            </div>
                        </td>`;
                    }
                });

                // Delete Button
                rowHTML += `<td><button class="delete" onclick="deleteRow('${type}', ${row.id})">&times;</button></td></tr>`;
                return rowHTML;
            }).join('');
        }

        function updateStageSelect() {
            const select = document.getElementById('stageSelect');
            const currentVal = select.value;
            
            let options = state.stages.map(s => `<option value="${s}">${s}</option>`).join('');
            if(state.stages.length > 0) {
                options += `<option value="ALL">ALL (Combined)</option>`;
            }
            
            select.innerHTML = options;

            if(state.stages.includes(currentVal) || currentVal === 'ALL') {
                select.value = currentVal;
            } else if(state.stages.length > 0) {
                select.value = state.stages[0];
            }
        }

        // --- ACTIONS ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            document.getElementById('section-env').style.display = tab === 'env' ? 'block' : 'none';
            document.getElementById('section-conn').style.display = tab === 'conn' ? 'block' : 'none';
        }

        function addStage() {
            const input = document.getElementById('newStageInput');
            const val = input.value.trim();
            if(val && !state.stages.includes(val)) {
                state.stages.push(val);
                input.value = '';
                saveState();
                refreshAll();
            }
        }

        function removeStage(stageName) {
            if(confirm(`Remove stage "${stageName}"?`)) {
                state.stages = state.stages.filter(s => s !== stageName);
                saveState();
                refreshAll();
            }
        }

        function addRow(type) {
            const newRow = { id: Date.now(), key: '', values: {} };
            if(type === 'env') state.envVars.push(newRow);
            else state.connRefs.push(newRow);
            saveState();
            renderTable(type);
        }

        function deleteRow(type, id) {
            if(type === 'env') state.envVars = state.envVars.filter(r => r.id !== id);
            else state.connRefs = state.connRefs.filter(r => r.id !== id);
            saveState();
            renderTable(type);
            generateJSON();
        }

        function updateKey(type, id, val) {
            const data = type === 'env' ? state.envVars : state.connRefs;
            const item = data.find(r => r.id === id);
            if(item) { item.key = val; saveState(); generateJSON(); }
        }

        function updateEnvValue(id, stage, val) {
            const item = state.envVars.find(r => r.id === id);
            if(item) { item.values[stage] = val; saveState(); generateJSON(); }
        }

        function updateConnValue(id, stage, field, val) {
            const item = state.connRefs.find(r => r.id === id);
            if(item) { 
                if(!item.values[stage]) item.values[stage] = { connectionId: '', connectorId: '' };
                item.values[stage][field] = val;
                saveState();
                generateJSON(); 
            }
        }

        function refreshAll() {
            renderStages();
            renderTable('env');
            renderTable('conn');
            updateStageSelect();
            generateJSON();
        }

        // --- GENERATOR LOGIC ---
        function buildPayload(stage) {
            const output = {
                "EnvironmentVariables": [],
                "ConnectionReferences": []
            };

            state.envVars.forEach(v => {
                if(v.key) {
                    output.EnvironmentVariables.push({
                        "SchemaName": v.key,
                        "Value": v.values[stage] || ""
                    });
                }
            });

            state.connRefs.forEach(c => {
                if(c.key) {
                    const valObj = c.values[stage] || {};
                    output.ConnectionReferences.push({
                        "LogicalName": c.key,
                        "ConnectionId": valObj.connectionId || "",
                        "ConnectorId": valObj.connectorId || ""
                    });
                }
            });
            return output;
        }

        function buildAllPayload() {
            const allData = {};
            state.stages.forEach(stage => {
                allData[stage] = buildPayload(stage);
            });
            return allData;
        }

        function generateJSON() {
            const stage = document.getElementById('stageSelect').value;
            if(!stage) {
                document.getElementById('jsonOutput').textContent = "{}";
                return;
            }

            let output;
            if (stage === 'ALL') {
                output = buildAllPayload();
            } else {
                output = buildPayload(stage);
            }
            
            document.getElementById('jsonOutput').textContent = JSON.stringify(output, null, 2);
        }

        function copyToClipboard() {
            const text = document.getElementById('jsonOutput').textContent;
            navigator.clipboard.writeText(text).then(() => showToast("Copied to clipboard!"));
        }

        function showToast(message) {
            const x = document.getElementById("toast");
            x.textContent = message;
            x.className = "show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Start
        init();
    </script>
</body>
</html>
