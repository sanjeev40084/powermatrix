<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Platform Deployment Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            light: '#0078d4',
                            DEFAULT: '#0078d4',
                            dark: '#2899f5',
                        }
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'system-ui', 'sans-serif'],
                        mono: ['Consolas', 'Monaco', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(5px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .transition-all-300 { transition: all 0.3s ease-in-out; }
        
        /* Fix for sticky header border collapse issues */
        th { position: sticky; top: 0; z-index: 10; }
        /* Ensure background covers scrolling content */
        .light-header-bg { background-color: #f8fafc; } /* slate-50 */
        .dark-header-bg { background-color: #18181b; } /* zinc-900 */
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-300 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight">Power Platform Deployment Settings</h1>
                <p class="text-slate-500 dark:text-zinc-400 text-sm mt-1">Generate your pipeline configuration JSON instantly.</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="resetData()" class="group flex items-center gap-2 px-4 py-2 rounded-md border border-slate-200 dark:border-zinc-700 hover:bg-slate-100 dark:hover:bg-zinc-800 text-sm font-medium transition-all duration-200" title="Reset Data">
                    <span class="group-hover:rotate-180 transition-transform duration-500">🗑️</span> Reset
                </button>
                <button onclick="toggleTheme()" class="flex items-center justify-center w-10 h-10 rounded-full border border-slate-200 dark:border-zinc-700 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-all duration-300 transform hover:scale-105" title="Toggle Theme">
                    <span id="themeIcon" class="text-lg">🌙</span>
                </button>
            </div>
        </header>

        <div class="bg-white dark:bg-zinc-800 rounded-lg shadow-sm border border-slate-200 dark:border-zinc-700 p-6 transition-all duration-300">
            <h2 class="text-lg font-semibold border-b border-slate-100 dark:border-zinc-700 pb-4 mb-6">Configuration Matrix</h2>

            <div class="flex flex-col md:flex-row gap-6 mb-8 items-start md:items-center justify-between">
                <div class="flex flex-wrap items-center gap-3">
                    <span class="text-sm font-semibold text-slate-500 dark:text-zinc-400 uppercase tracking-wider">Stages:</span>
                    <div id="stageList" class="flex flex-wrap gap-2 transition-all duration-300"></div>
                </div>
                <div class="flex w-full md:w-auto gap-2">
                    <input type="text" id="newStageInput" placeholder="New Stage (e.g. UAT)" class="flex-1 md:w-40 px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-600 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 uppercase" style="text-transform: uppercase;"> 
                    <button onclick="addStage()" class="px-4 py-2 bg-primary text-white rounded-md text-sm font-medium hover:bg-blue-700 active:transform active:scale-95 transition-all duration-200 shadow-sm">Add</button>
                </div>
            </div>

            <div class="flex gap-8 border-b border-slate-200 dark:border-zinc-700 mb-6">
                <button onclick="switchTab('env')" id="tab-env" class="pb-3 text-sm font-medium border-b-2 border-primary text-primary transition-colors duration-200">Environment Variables</button>
                <button onclick="switchTab('conn')" id="tab-conn" class="pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 transition-colors duration-200">Connection References</button>
            </div>

            <div id="section-env" class="animate-fade-in">
                <div class="overflow-x-auto max-h-[60vh] mb-4 border border-slate-200 dark:border-zinc-700 rounded-md relative">
                    <table id="envTable" class="w-full text-sm text-left border-separate border-spacing-0">
                        <thead class="bg-slate-50 dark:bg-zinc-900 text-slate-500 dark:text-zinc-400 font-semibold"></thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-zinc-700"></tbody>
                    </table>
                </div>
                <button onclick="addRow('env')" class="flex items-center gap-2 text-primary hover:text-blue-700 dark:hover:text-blue-400 font-medium text-sm transition-colors duration-200 group">
                    <span class="w-5 h-5 flex items-center justify-center rounded-full bg-blue-50 dark:bg-blue-900/30 group-hover:bg-blue-100 dark:group-hover:bg-blue-900/50 transition-colors">+</span> Add Variable
                </button>
            </div>

            <div id="section-conn" class="hidden animate-fade-in">
                <div class="overflow-x-auto max-h-[60vh] mb-4 border border-slate-200 dark:border-zinc-700 rounded-md relative">
                    <table id="connTable" class="w-full text-sm text-left border-separate border-spacing-0">
                        <thead class="bg-slate-50 dark:bg-zinc-900 text-slate-500 dark:text-zinc-400 font-semibold"></thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-zinc-700"></tbody>
                    </table>
                </div>
                <button onclick="addRow('conn')" class="flex items-center gap-2 text-primary hover:text-blue-700 dark:hover:text-blue-400 font-medium text-sm transition-colors duration-200 group">
                    <span class="w-5 h-5 flex items-center justify-center rounded-full bg-blue-50 dark:bg-blue-900/30 group-hover:bg-blue-100 dark:group-hover:bg-blue-900/50 transition-colors">+</span> Add Reference
                </button>
            </div>
        </div>

        <div class="bg-white dark:bg-zinc-800 rounded-lg shadow-sm border border-slate-200 dark:border-zinc-700 p-6 transition-all duration-300">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                <h3 class="font-semibold text-lg">JSON Output</h3>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <select id="stageSelect" onchange="generateJSON()" class="flex-1 sm:w-48 px-3 py-2 bg-slate-50 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-600 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary"></select>
                    <button onclick="copyToClipboard()" class="p-2 border border-slate-200 dark:border-zinc-700 rounded-md hover:bg-slate-100 dark:hover:bg-zinc-700 text-lg transition-colors duration-200" title="Copy to Clipboard">📋</button>
                </div>
            </div>
            <pre id="jsonOutput" class="bg-slate-50 dark:bg-zinc-950 text-slate-700 dark:text-slate-300 p-4 rounded-md border border-slate-200 dark:border-zinc-700 font-mono text-xs md:text-sm overflow-auto max-h-96 shadow-inner transition-all duration-300">{}</pre>
        </div>
    </div>

    <datalist id="connectorList"></datalist>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-zinc-800 dark:bg-zinc-100 text-white dark:text-zinc-900 px-6 py-3 rounded shadow-lg font-medium text-sm transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50">Copied to clipboard!</div>

    <script>
        // --- DATA: Common Connectors ---
        const COMMON_CONNECTORS = [
            { name: "SharePoint", id: "/providers/Microsoft.PowerApps/apis/shared_sharepointonline" },
            { name: "Dataverse", id: "/providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps" },
            { name: "Office 365 Outlook", id: "/providers/Microsoft.PowerApps/apis/shared_office365" },
            { name: "Office 365 Users", id: "/providers/Microsoft.PowerApps/apis/shared_office365users" },
            { name: "Microsoft Teams", id: "/providers/Microsoft.PowerApps/apis/shared_teams" },
            { name: "OneDrive for Business", id: "/providers/Microsoft.PowerApps/apis/shared_onedriveforbusiness" },
            { name: "Excel Online (Business)", id: "/providers/Microsoft.PowerApps/apis/shared_excelonlinebusiness" },
            { name: "SQL Server", id: "/providers/Microsoft.PowerApps/apis/shared_sql" },
            { name: "Approvals", id: "/providers/Microsoft.PowerApps/apis/shared_approvals" },
            { name: "Azure DevOps", id: "/providers/Microsoft.PowerApps/apis/shared_visualstudioteamservices" }
        ];

        // --- UTILS: Debounce & Security ---
        // Prevents lag by delaying execution until user stops typing
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait);
            };
        }

        // XSS Protection
        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- THEME & STORAGE ---
        const STORAGE_KEY = 'pp_deployment_settings_v3';
        const THEME_KEY = 'theme';

        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(savedTheme === 'dark' || (!savedTheme && prefersDark) ? 'dark' : 'light');
        }

        function setTheme(theme) {
            document.documentElement.classList.toggle('dark', theme === 'dark');
            document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem(THEME_KEY, theme);
            // Refresh table to update header backgrounds
            if (document.getElementById('envTable').rows.length > 0) refreshAll();
        }

        function toggleTheme() {
            setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        }

        // --- STATE MANAGEMENT ---
        const defaultState = {
            stages: ['QA', 'TST', 'PRD'],
            envVars: [{ id: 1, key: 'cr56_sample_var', values: { 'QA': 'val_qa', 'TST': 'val_tst', 'PRD': 'val_prd' } }],
            connRefs: [{ id: 1, key: 'cr56_shared_sharepoint', connectorId: '', values: { 'QA': '', 'TST': '', 'PRD': '' } }]
        };

        let state = JSON.parse(JSON.stringify(defaultState));

        // Create debounced version of save & generate
        const debouncedSaveAndGenerate = debounce(() => {
            saveState();
            generateJSON();
        }, 300);

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { state = JSON.parse(saved); } catch(e) { console.error("Failed load", e); }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function resetData() {
            if(confirm("Reset all data? This cannot be undone.")) {
                state = JSON.parse(JSON.stringify(defaultState));
                saveState();
                refreshAll();
                showToast("Data reset successfully");
            }
        }

        // --- RENDER FUNCTIONS ---
        function init() {
            initTheme();
            loadState();
            renderDatalist();
            refreshAll();
        }

        function renderDatalist() {
            const datalist = document.getElementById('connectorList');
            datalist.innerHTML = COMMON_CONNECTORS.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        function renderStages() {
            document.getElementById('stageList').innerHTML = state.stages.map(s => 
                `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300 border border-blue-200 dark:border-blue-800 animate-fade-in">
                    ${escapeHtml(s)} <button onclick="removeStage('${escapeHtml(s)}')" class="ml-2 hover:text-blue-600 dark:hover:text-blue-200 focus:outline-none text-base leading-none">&times;</button>
                </span>`
            ).join('');
        }

        function renderTable(type) {
            const tableId = type === 'env' ? 'envTable' : 'connTable';
            const data = type === 'env' ? state.envVars : state.connRefs;
            const keyLabel = type === 'env' ? 'Schema Name' : 'Definition';

            const thead = document.querySelector(`#${tableId} thead`);
            const tbody = document.querySelector(`#${tableId} tbody`);
            
            // Header BG color handling for Sticky effect
            const headerBgClass = document.documentElement.classList.contains('dark') ? 'bg-zinc-900' : 'bg-slate-50';

            // Header
            let headerHTML = `<tr><th class="px-4 py-3 min-w-[250px] border-b border-slate-200 dark:border-zinc-700 ${headerBgClass}">${keyLabel}</th>`;
            state.stages.forEach(stage => {
                headerHTML += `<th class="px-4 py-3 min-w-[180px] border-b border-slate-200 dark:border-zinc-700 ${headerBgClass}">${escapeHtml(stage)}`;
                if (type === 'conn') {
                    headerHTML += ` <span class="text-[10px] font-normal opacity-70 block">Connection ID (GUID)</span>`;
                }
                headerHTML += `</th>`;
            });
            headerHTML += `<th class="px-4 py-3 w-10 border-b border-slate-200 dark:border-zinc-700 ${headerBgClass}"></th></tr>`;
            thead.innerHTML = headerHTML;

            // Body
            tbody.innerHTML = data.map(row => {
                // Highlighting active row logic added
                let rowHTML = `<tr class="group hover:bg-slate-50 dark:hover:bg-zinc-800/50 focus-within:bg-blue-50 dark:focus-within:bg-blue-900/10 transition-colors duration-150">`;
                
                // Column 1: Definition
                rowHTML += `<td class="px-4 py-3 space-y-2 border-b border-slate-100 dark:border-zinc-800">                    
                    <input type="text" placeholder="${type === 'env' ? 'Schema Name' : 'Logical Name'}" value="${escapeHtml(row.key)}" oninput="updateKey('${type}', ${row.id}, this.value)" 
                        class="w-full px-2 py-1.5 bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-medium">`;
                
                if(type === 'conn') {
                    rowHTML += `<input type="text" list="connectorList" placeholder="Connector ID (Type to search...)" value="${escapeHtml(row.connectorId || '')}" oninput="updateConnectorId(${row.id}, this.value)"
                        class="w-full px-2 py-1.5 bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-mono text-xs text-slate-600 dark:text-zinc-400" title="Select common connector or type custom ID">`;
                }
                rowHTML += `</td>`;
                
                // Stage Values
                state.stages.forEach(stage => {
                    const safeStage = escapeHtml(stage);
                    const val = row.values[stage] || '';
                    
                    if (type === 'env') {
                        rowHTML += `<td class="px-4 py-3 align-top border-b border-slate-100 dark:border-zinc-800">
                            <input type="text" placeholder="Value" value="${escapeHtml(val)}" oninput="updateValue('env', ${row.id}, '${safeStage}', this.value)"
                            class="w-full px-2 py-1.5 bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                        </td>`;
                    } else {
                        rowHTML += `<td class="px-4 py-3 align-top border-b border-slate-100 dark:border-zinc-800">
                            <input type="text" placeholder="GUID" value="${escapeHtml(val)}" oninput="updateValue('conn', ${row.id}, '${safeStage}', this.value)"
                            class="w-full px-2 py-1.5 bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-mono text-xs">
                        </td>`;
                    }
                });

                rowHTML += `<td class="px-4 py-3 text-center align-top pt-4 border-b border-slate-100 dark:border-zinc-800">
                    <button onclick="deleteRow('${type}', ${row.id})" class="text-slate-400 hover:text-red-500 transition-colors p-1 rounded hover:bg-red-50 dark:hover:bg-red-900/20 text-lg leading-none">&times;</button>
                </td></tr>`;
                return rowHTML;
            }).join('');
        }

        function updateStageSelect() {
            const select = document.getElementById('stageSelect');
            const currentVal = select.value;
            let options = state.stages.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
            if(state.stages.length > 0) options += `<option value="ALL">ALL (Combined)</option>`;
            select.innerHTML = options;
            if(state.stages.includes(currentVal) || currentVal === 'ALL') select.value = currentVal;
            else if(state.stages.length > 0) select.value = state.stages[0];
        }

        // --- ACTIONS ---
        function switchTab(tab) {
            const activeClass = ['border-primary', 'text-primary'];
            const inactiveClass = ['border-transparent', 'text-slate-500', 'dark:text-zinc-400'];
            ['env', 'conn'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const section = document.getElementById(`section-${t}`);
                if(t === tab) {
                    el.classList.remove(...inactiveClass); el.classList.add(...activeClass);
                    section.classList.remove('hidden');
                } else {
                    el.classList.remove(...activeClass); el.classList.add(...inactiveClass);
                    section.classList.add('hidden');
                }
            });
            // Refresh table on tab switch to ensure column widths/sticky headers calculate correctly
            renderTable(tab);
        }

        function addStage() {
            const input = document.getElementById('newStageInput');
            const val = input.value.trim().toUpperCase();
            if(val && !state.stages.includes(val)) {
                state.stages.push(val);
                input.value = '';
                saveState(); refreshAll();
            }
        }

        function removeStage(stageName) {
            const stage = state.stages.find(s => escapeHtml(s) === stageName || s === stageName);
            if(stage && confirm(`Remove stage "${stage}"?`)) {
                state.stages = state.stages.filter(s => s !== stage);
                saveState(); refreshAll();
            }
        }

        function addRow(type) {
            const newRow = { id: Date.now(), key: '', values: {} };
            if(type === 'conn') newRow.connectorId = ''; 
            const list = type === 'env' ? state.envVars : state.connRefs;
            list.push(newRow);
            saveState(); renderTable(type);
        }

        function deleteRow(type, id) {
            if(type === 'env') state.envVars = state.envVars.filter(r => r.id !== id);
            else state.connRefs = state.connRefs.filter(r => r.id !== id);
            saveState(); renderTable(type); generateJSON();
        }

        // Updated Update Functions (Now using Debounce)
        function updateKey(type, id, val) {
            const list = type === 'env' ? state.envVars : state.connRefs;
            const item = list.find(r => r.id === id);
            if(item) { item.key = val; debouncedSaveAndGenerate(); }
        }

        function updateConnectorId(id, val) {
            const item = state.connRefs.find(r => r.id === id);
            if(item) { item.connectorId = val; debouncedSaveAndGenerate(); }
        }

        function updateValue(type, id, stage, val) {
            const realStage = state.stages.find(s => escapeHtml(s) === stage) || stage;
            const list = type === 'env' ? state.envVars : state.connRefs;
            const item = list.find(r => r.id === id);
            if(item) { item.values[realStage] = val; debouncedSaveAndGenerate(); }
        }

        function refreshAll() {
            renderStages(); renderTable('env'); renderTable('conn'); updateStageSelect(); generateJSON();
        }

        // --- GENERATOR ---
        function buildPayload(stage) {
            const output = { "EnvironmentVariables": [], "ConnectionReferences": [] };
            const realStage = state.stages.find(s => escapeHtml(s) === stage) || stage;
            state.envVars.forEach(v => {
                if(v.key) output.EnvironmentVariables.push({ "SchemaName": v.key, "Value": v.values[realStage] || "" });
            });
            state.connRefs.forEach(c => {
                if(c.key) {
                    output.ConnectionReferences.push({
                        "LogicalName": c.key,
                        "ConnectionId": c.values[realStage] || "",
                        "ConnectorId": c.connectorId || ""
                    });
                }
            });
            return output;
        }

        function buildAllPayload() {
            const allData = {};
            state.stages.forEach(stage => { allData[stage] = buildPayload(stage); });
            return allData;
        }

        function generateJSON() {
            const stage = document.getElementById('stageSelect').value;
            if(!stage) { document.getElementById('jsonOutput').textContent = "{}"; return; }
            let output = (stage === 'ALL') ? buildAllPayload() : buildPayload(stage);
            document.getElementById('jsonOutput').textContent = JSON.stringify(output, null, 2);
        }

        function copyToClipboard() {
            const text = document.getElementById('jsonOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.classList.remove('opacity-0', 'translate-y-4');
                setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4'), 2000);
            });
        }

        init();
    </script>
</body>
</html>
